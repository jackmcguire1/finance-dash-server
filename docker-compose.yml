services:
  postgres:
    image: postgres:17-alpine
    ports:
      - 5435:5432
    volumes:
      - ~/apps/postgres-finance-dash:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: financedashdb
      POSTGRES_HOST_AUTH_METHOD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile.dev
    ports:
      - 8080:8080   # Fastify API
      - 9229:9229   # Node inspector (VS Code debugger)
    volumes:
      - ./server/src:/app/server/src
      - ./db:/app/db
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: financedashdb
      PORT: 8080
      COINGECKO_API_KEY: xxx
      FIREBASE_PROJECT_ID: demo-finance-dash
      FIREBASE_AUTH_EMULATOR_HOST: firebase-emulator:9099
    depends_on:
      postgres:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./server/package.json

  firebase-emulator:
    image: andreysenov/firebase-tools:latest
    command: firebase emulators:start --only auth --project demo-finance-dash
    ports:
      - 9099:9099   # Auth emulator
      - 4000:4000   # Emulator UI
    volumes:
      - ./firebase.json:/home/node/firebase.json

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    ports:
      - 3000:3000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/.env:/app/.env
    environment:
      HOST: "0.0.0.0"
      BROWSER: "none"
    depends_on:
      - server
      - firebase-emulator
    develop:
      watch:
        - action: rebuild
          path: ./frontend/package.json
